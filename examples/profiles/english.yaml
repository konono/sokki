# 英語Whisperの確定原文を保存し、日本語訳を別表示・別保存する例。
# Whisperモデルは既定探索先へ置くか、transcription.model に絶対パスを設定する。
# Claude CLIの導入・認証が必要。Ollamaへ切り替える場合はllm.provider/model/ollama_urlを編集する。
capture:
  device: "Conference Output"
transcription:
  backend: whisper
  final_strategy: hybrid
  language: en
  model: ""
translation:
  mode: en-ja
summary:
  enabled: true
llm:
  provider: claude
  model: ""
output:
  directory: transcripts/english
